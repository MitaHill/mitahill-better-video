name: 构建容器镜像

on:
  push:
    branches:
      - dev
      - main
    tags:
      - "v*"
  pull_request:
    types:
      - opened
      - closed
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: docker-image-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # PR 合并后会由目标分支的 push 事件构建，这里跳过已合并的 closed，避免同一次变更触发两次。
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action == 'opened' ||
      github.event.pull_request.merged == false
    runs-on: ubuntu-latest

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 确定镜像标签
        id: image_tag
        env:
          ACTION_REF: ${{ github.ref }}
        run: |
          # release=true 表示稳定发布（main 和版本标签）：清空仓库旧镜像并打 latest 标签。
          # dev 只推送 dev 标签，不清空仓库，也不覆盖 latest。
          release=false
          case "$ACTION_REF" in
            refs/heads/main) tag="latest"; release=true ;;
            refs/heads/dev) tag="dev" ;;
            refs/tags/v*) tag="${ACTION_REF#refs/tags/}"; release=true ;;
            refs/pull/*) tag="pr-test" ;;
            *) tag="manual" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: 登录 Docker Hub
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: 构建基础镜像
        run: |
          docker build \
            --file deploy/docker/base/Dockerfile \
            --network host \
            --tag base_better_video:20260210-2330 \
            .

      - name: 构建应用镜像
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
        run: |
          docker build \
            --file deploy/docker/for-app/Dockerfile \
            --network host \
            --tag "kindmitaishere/mitahill-better-video:$IMAGE_TAG" \
            .

      - name: 在镜像内运行单元测试
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
        run: |
          modules=$(ls tests/test_*.py | sed 's/\.py$//; s#/#.#')
          docker run --rm \
            --volume "$PWD/tests:/workspace/tests:ro" \
            --workdir /workspace \
            "kindmitaishere/mitahill-better-video:$IMAGE_TAG" \
            python3 -m unittest -v $modules

      # 构建和测试都通过后才清空仓库，避免构建失败时 Docker Hub 上一个镜像都不剩。
      - name: 清空 Docker Hub 仓库旧镜像
        if: github.event_name != 'pull_request' && steps.image_tag.outputs.release == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://hub.docker.com/v2/repositories/kindmitaishere/mitahill-better-video/tags"

          jwt=$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" '{username: $u, password: $p}' \
            | curl -fsS -H "Content-Type: application/json" -d @- https://hub.docker.com/v2/users/login \
            | jq -r '.token')
          if [ -z "$jwt" ] || [ "$jwt" = "null" ]; then
            echo "Docker Hub API 登录失败" >&2
            exit 1
          fi

          # 每轮取第一页并全部删除，直到仓库为空；最多 20 轮，防止删除无效时死循环
          for round in $(seq 1 20); do
            tags=$(curl -fsS -H "Authorization: JWT $jwt" "$api?page_size=100" | jq -r '.results[].name')
            if [ -z "$tags" ]; then
              echo "仓库已清空"
              exit 0
            fi
            for tag in $tags; do
              curl -fsS -o /dev/null -X DELETE -H "Authorization: JWT $jwt" "$api/$tag/"
              echo "已删除标签 $tag"
            done
          done
          echo "清空 20 轮后仓库仍有标签，请检查 Token 权限" >&2
          exit 1

      - name: 推送应用镜像并打最新标签
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
          RELEASE: ${{ steps.image_tag.outputs.release }}
        run: |
          repo="kindmitaishere/mitahill-better-video"
          docker push "$repo:$IMAGE_TAG"
          if [ "$RELEASE" = "true" ] && [ "$IMAGE_TAG" != "latest" ]; then
            docker tag "$repo:$IMAGE_TAG" "$repo:latest"
            docker push "$repo:latest"
          fi

      - name: 清理构建残留
        if: always()
        run: docker image prune --force

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 创建或更新发行版
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # 以 alpha、beta 结尾的版本一律标为预览版（预发行版）
          case "$TAG" in
            *alpha|*beta)
              title="$TAG 预览版"
              prerelease_flag="--prerelease"
              summary="预览版：功能与接口可能变动，不建议用于生产环境。"
              ;;
            *)
              title="$TAG"
              prerelease_flag="--prerelease=false"
              summary="正式版。"
              ;;
          esac

          # Docker 拉取与运行命令取自 README.md 中 release-docker 标记之间的内容
          docker_section=$(sed -n '/<!-- release-docker:start -->/,/<!-- release-docker:end -->/p' README.md | sed '1d;$d')
          if [ -z "$docker_section" ]; then
            echo "README.md 中缺少 release-docker 标记段落" >&2
            exit 1
          fi

          {
            echo "$summary"
            echo
            echo "## Docker 镜像"
            echo
            echo "Docker Hub 仓库只保留最近一次构建的镜像，因此这里统一使用 \`latest\` 标签。"
            echo
            echo "$docker_section"
          } > release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file release-notes.md $prerelease_flag
          else
            gh release create "$TAG" --verify-tag --title "$title" --notes-file release-notes.md $prerelease_flag
          fi
