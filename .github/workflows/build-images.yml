name: 构建容器镜像

on:
  push:
    branches:
      - dev
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-image-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 确定镜像标签
        id: image_tag
        env:
          ACTION_REF: ${{ github.ref }}
        run: |
          case "$ACTION_REF" in
            refs/heads/main) tag="latest" ;;
            refs/heads/dev) tag="dev" ;;
            refs/tags/v*) tag="${ACTION_REF#refs/tags/}" ;;
            *) tag="manual" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 登录 Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: 构建基础镜像
        run: |
          docker build \
            --file deploy/docker/base/Dockerfile \
            --network host \
            --tag base_better_video:20260210-2330 \
            .

      - name: 构建应用镜像
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
        run: |
          docker build \
            --file deploy/docker/for-app/Dockerfile \
            --network host \
            --tag "kindmitaishere/mitahill-better-video:$IMAGE_TAG" \
            .

      - name: 在镜像内运行单元测试
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
        run: |
          modules=$(ls tests/test_*.py | sed 's/\.py$//; s#/#.#')
          docker run --rm \
            --volume "$PWD/tests:/workspace/tests:ro" \
            --workdir /workspace \
            "kindmitaishere/mitahill-better-video:$IMAGE_TAG" \
            python3 -m unittest -v $modules

      - name: 推送应用镜像
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
        run: docker push "kindmitaishere/mitahill-better-video:$IMAGE_TAG"

      - name: 清理构建残留
        if: always()
        run: docker image prune --force
