name: 构建容器镜像

on:
  push:
    branches:
      - dev
      - main
    tags:
      - "v*"
  pull_request:
    types:
      - opened
      - closed
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: docker-image-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: ci
    # ponytail: 三个阶段共享 Runner 的本地镜像，避免传输数 GB 的中间产物。
    # PR 合并后只由目标分支的 push 构建，避免重复运行。
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action == 'opened' ||
      github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    permissions:
      contents: write # 版本标签的发行说明需要写权限；令牌仅在 push 步骤提供。
    steps:
      - name: 准备源码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: build
        id: build
        env:
          ACTION_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          release=false
          case "$ACTION_REF" in
            refs/heads/main) tag="latest"; release=true ;;
            refs/heads/dev) tag="dev" ;;
            refs/tags/v*) tag="${ACTION_REF#refs/tags/}"; release=true ;;
            refs/pull/*) tag="pr-test" ;;
            *) tag="manual" ;;
          esac
          channel=dev
          [ "$release" = "false" ] || channel=stable
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

          docker build \
            --file deploy/docker/base/Dockerfile \
            --network host \
            --tag base_better_video:20260210-2330 .
          image="kindmitaishere/mitahill-better-video:ci-$GITHUB_SHA"
          docker build \
            --file deploy/docker/for-app/Dockerfile \
            --build-arg BUILD_CHANNEL="$channel" \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --network host --tag "$image" .
          echo "image_id=$(docker image inspect --format '{{.Id}}' "$image")" >> "$GITHUB_OUTPUT"

      - name: test
        env:
          IMAGE_ID: ${{ steps.build.outputs.image_id }}
        run: |
          set -euo pipefail
          npm ci --prefix app/WebUI
          npm test --prefix app/WebUI
          modules=$(cd scripts/tests && ls test_*.py | sed 's/\.py$//; s/^/tests./')
          docker run --rm \
            --volume "$PWD/scripts/tests:/workspace/tests:ro" \
            --volume "$PWD/scripts/loop:/workspace/scripts/loop:ro" \
            --workdir /workspace "$IMAGE_ID" \
            python3 -m unittest -v $modules

      - name: push
        if: github.event_name != 'pull_request'
        env:
          IMAGE_ID: ${{ steps.build.outputs.image_id }}
          IMAGE_TAG: ${{ steps.build.outputs.tag }}
          RELEASE: ${{ steps.build.outputs.release }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ACTION_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          if [ "$RELEASE" = "true" ]; then
            clear_old_tags() {
              set -euo pipefail
              api="https://hub.docker.com/v2/repositories/kindmitaishere/mitahill-better-video/tags"

              jwt=$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" '{username: $u, password: $p}' \
                | curl -fsS -H "Content-Type: application/json" -d @- https://hub.docker.com/v2/users/login \
                | jq -r '.token')
              if [ -z "$jwt" ] || [ "$jwt" = "null" ]; then
                echo "Docker Hub API 登录失败" >&2
                exit 1
              fi

              # 每轮取第一页并全部删除，直到仓库为空；最多 20 轮，防止删除无效时死循环
              for round in $(seq 1 20); do
                code=$(curl -sS -o tags.json -w '%{http_code}' -H "Authorization: JWT $jwt" "$api?page_size=100")
                if [ "$code" = "404" ]; then
                  echo "仓库不存在，无需清空（推送时会自动创建）"
                  return 0
                elif [ "$code" != "200" ]; then
                  echo "列出标签失败，HTTP $code" >&2
                  exit 1
                fi
                tags=$(jq -r '.results[].name' tags.json)
                if [ -z "$tags" ]; then
                  echo "仓库已清空"
                  return 0
                fi
                # 标签列表有延迟，可能列出刚删掉的标签，删除返回 404 视为已不存在。
                # 一轮下来一个都没删掉，说明剩下的都是过期条目，仓库已清空。
                deleted=0
                for tag in $tags; do
                  code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: JWT $jwt" "$api/$tag/")
                  case "$code" in
                    2??) echo "已删除标签 $tag"; deleted=$((deleted + 1)) ;;
                    404) echo "标签 $tag 已不存在，跳过" ;;
                    *) echo "删除标签 $tag 失败，HTTP $code" >&2; exit 1 ;;
                  esac
                done
                if [ "$deleted" -eq 0 ]; then
                  echo "仓库已清空（列表中剩余的是过期条目）"
                  return 0
                fi
              done
              echo "清空 20 轮后仓库仍有标签，请检查 Token 权限" >&2
              exit 1
            }
            clear_old_tags
          fi

          repo="kindmitaishere/mitahill-better-video"
          docker tag "$IMAGE_ID" "$repo:$IMAGE_TAG"
          docker push "$repo:$IMAGE_TAG"
          docker tag "$IMAGE_ID" "$repo:sha-$GITHUB_SHA"
          docker push "$repo:sha-$GITHUB_SHA"
          if [ "$RELEASE" = "true" ] && [ "$IMAGE_TAG" != "latest" ]; then
            docker tag "$IMAGE_ID" "$repo:latest"
            docker push "$repo:latest"
          fi

          if [[ "$ACTION_REF" == refs/tags/v* ]]; then
            # 以 alpha、beta 结尾的版本一律标为预览版（预发行版）
            case "$TAG" in
              *alpha|*beta)
                title="$TAG 预览版"
                prerelease_flag="--prerelease"
                summary="预览版：功能与接口可能变动，不建议用于生产环境。"
                ;;
              *)
                title="$TAG"
                prerelease_flag="--prerelease=false"
                summary="正式版。"
                ;;
            esac

            # Docker 拉取与运行命令取自 README.md 中 release-docker 标记之间的内容
            docker_section=$(sed -n '/<!-- release-docker:start -->/,/<!-- release-docker:end -->/p' README.md | sed '1d;$d')
            if [ -z "$docker_section" ]; then
              echo "README.md 中缺少 release-docker 标记段落" >&2
              exit 1
            fi

            {
              echo "$summary"
              echo
              echo "## Docker 镜像"
              echo
              echo "Docker Hub 仓库只保留最近一次构建的镜像，因此这里统一使用 \`latest\` 标签。"
              echo
              echo "$docker_section"
            } > release-notes.md

            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "$title" --notes-file release-notes.md $prerelease_flag
            else
              gh release create "$TAG" --verify-tag --title "$title" --notes-file release-notes.md $prerelease_flag
            fi
          fi
