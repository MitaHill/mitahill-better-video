name: 构建容器镜像

on:
  push:
    branches:
      - dev
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: 127.0.0.1:3300
  IMAGE_NAME: 127.0.0.1:3300/mitahill/mitahill-better-video
  BASE_IMAGE_NAME: 127.0.0.1:3300/mitahill/mitahill-better-video-base
  LOCAL_BASE_IMAGE: base_better_video:20260210-2330

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 检查 Docker
        run: docker info

      - name: 配置内网注册表认证
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          mkdir -p "$HOME/.docker"
          auth="$(printf '%s:%s' "$REGISTRY_USERNAME" "$REGISTRY_TOKEN" | base64 -w 0)"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$REGISTRY" "$auth" > "$HOME/.docker/config.json"

      - name: 确定镜像标签
        id: image_tag
        env:
          ACTION_REF: ${{ gitea.ref }}
        run: |
          case "$ACTION_REF" in
            refs/heads/main) tag="latest" ;;
            refs/heads/dev) tag="dev" ;;
            refs/tags/v*) tag="${ACTION_REF#refs/tags/}" ;;
            *) tag="manual" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 读取基础镜像缓存
        run: |
          docker pull "$BASE_IMAGE_NAME:${{ steps.image_tag.outputs.tag }}" || true

      - name: 构建基础镜像
        run: |
          docker build \
            --cache-from "$BASE_IMAGE_NAME:${{ steps.image_tag.outputs.tag }}" \
            --file deploy/docker/base/Dockerfile \
            --network host \
            --tag "$LOCAL_BASE_IMAGE" \
            .

      - name: 构建应用镜像
        run: |
          docker pull "$IMAGE_NAME:${{ steps.image_tag.outputs.tag }}" || true
          docker build \
            --cache-from "$IMAGE_NAME:${{ steps.image_tag.outputs.tag }}" \
            --file deploy/docker/for-app/Dockerfile \
            --network host \
            --tag "better_video:latest" \
            .

      - name: 推送镜像
        run: |
          docker tag "$LOCAL_BASE_IMAGE" "$BASE_IMAGE_NAME:${{ steps.image_tag.outputs.tag }}"
          docker tag "better_video:latest" "$IMAGE_NAME:${{ steps.image_tag.outputs.tag }}"
          docker push "$BASE_IMAGE_NAME:${{ steps.image_tag.outputs.tag }}"
          docker push "$IMAGE_NAME:${{ steps.image_tag.outputs.tag }}"
