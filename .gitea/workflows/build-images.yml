name: 构建容器镜像

on:
  push:
    branches:
      - dev
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: 192.168.9.4:3300
  IMAGE_NAME: 192.168.9.4:3300/mitahill/mitahill-better-video
  BASE_IMAGE_NAME: 192.168.9.4:3300/mitahill/mitahill-better-video-base
  LOCAL_BASE_IMAGE: base_better_video:20260210-2330

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 检查 Docker
        run: docker info

      - name: 安装内网镜像传输工具
        run: |
          apt-get update
          apt-get install -y --no-install-recommends skopeo

      - name: 确定镜像标签
        id: image_tag
        env:
          ACTION_REF: ${{ gitea.ref }}
        run: |
          case "$ACTION_REF" in
            refs/heads/main) tag="latest" ;;
            refs/heads/dev) tag="dev" ;;
            refs/tags/v*) tag="${ACTION_REF#refs/tags/}" ;;
            *) tag="manual" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 读取基础镜像缓存
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          skopeo copy \
            --src-tls-verify=false \
            --src-creds "$REGISTRY_USERNAME:$REGISTRY_TOKEN" \
            "docker://$BASE_IMAGE_NAME:${{ steps.image_tag.outputs.tag }}" \
            "docker-daemon:$LOCAL_BASE_IMAGE" || true

      - name: 构建基础镜像
        run: |
          docker build \
            --cache-from "$LOCAL_BASE_IMAGE" \
            --file deploy/docker/base/Dockerfile \
            --network host \
            --tag "$LOCAL_BASE_IMAGE" \
            .

      - name: 构建应用镜像
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          skopeo copy \
            --src-tls-verify=false \
            --src-creds "$REGISTRY_USERNAME:$REGISTRY_TOKEN" \
            "docker://$IMAGE_NAME:${{ steps.image_tag.outputs.tag }}" \
            "docker-daemon:better_video:cache" || true
          docker build \
            --cache-from "better_video:cache" \
            --file deploy/docker/for-app/Dockerfile \
            --network host \
            --tag "better_video:latest" \
            .

      - name: 推送镜像
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          skopeo copy \
            --dest-tls-verify=false \
            --dest-creds "$REGISTRY_USERNAME:$REGISTRY_TOKEN" \
            "docker-daemon:$LOCAL_BASE_IMAGE" \
            "docker://$BASE_IMAGE_NAME:${{ steps.image_tag.outputs.tag }}"
          skopeo copy \
            --dest-tls-verify=false \
            --dest-creds "$REGISTRY_USERNAME:$REGISTRY_TOKEN" \
            "docker-daemon:better_video:latest" \
            "docker://$IMAGE_NAME:${{ steps.image_tag.outputs.tag }}"
